site_name: LongCache
site_description: Semantic similarity cache for LLM and RAG pipelines
site_url: https://endevsols.github.io/LongCache
repo_url: https://github.com/ENDEVSOLS/LongCache
repo_name: ENDEVSOLS/LongCache
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - How It Works:
    - Architecture: how-it-works/architecture.md
    - Similarity & Thresholds: how-it-works/similarity-and-thresholds.md
    - Caching Strategies: how-it-works/caching-strategies.md
  - Storage Backends:
    - Overview: backends/overview.md
    - SQLite: backends/sqlite.md
    - Redis: backends/redis.md
    - Memory: backends/memory.md
  - Integrations:
    - LangChain: integrations/langchain.md
    - LangGraph: integrations/langgraph.md
    - LlamaIndex: integrations/llamaindex.md
    - OpenAI: integrations/openai.md
    - FastAPI: integrations/fastapi.md
    - Changing-document RAG: integrations/versioned-rag.md
  - Reliability and Upgrade: reliability.md
  - v0.3 Implementation Plan: plans/v0.3.0.md
  - v0.3 Execution Record: plans/v0.3.0-execution.md
  - v0.3 Acceptance Evidence: plans/v0.3.0-acceptance.md
  - CLI Reference: cli.md
  - API Reference: api-reference.md
  - Upgrade to v0.3: migration-v0.3.md
  - Legacy Migration to v0.2: migration-v0.2.md
  - v0.2 Implementation Plan: plans/v0.2.0.md
  - v0.2 Execution Record: plans/v0.2.0-execution.md
  - v0.2 Acceptance Evidence: plans/v0.2.0-acceptance.md
  - Benchmarks: benchmarks.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ENDEVSOLS/LongCache
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/longcache/
