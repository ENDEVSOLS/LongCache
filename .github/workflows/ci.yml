name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - name: Check lint and formatting
        run: make lint

  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LONGCACHE_TEST_REDIS_URL: redis://localhost:16379/0
      LONGCACHE_TEST_MODEL: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies and model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/huggingface
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

      - name: Install locked package and test dependencies
        run: |
          pip install uv
          uv sync --locked --python ${{ matrix.python-version }} --extra all --extra dev --extra docs

      - name: Confirm Redis is reachable
        run: uv run --no-sync python -c "import os, redis; redis.Redis.from_url(os.environ['LONGCACHE_TEST_REDIS_URL']).ping()"

      - name: Run test suite with coverage
        run: |
          uv run --no-sync pytest tests/ -v --tb=short -rs --junitxml=evaluation/reports/pytest-ci.xml --cov=src/longcache --cov-report=term-missing

      - name: Evaluate changing-document RAG workflow
        if: matrix.python-version == '3.12'
        run: uv run --no-sync python -m evaluation.rag --output evaluation/reports/v0_3_rag.json

      - name: Run offline public-interface example
        run: uv run --no-sync python examples/safe_reuse.py

      - name: Run offline reliability example
        run: uv run --no-sync python examples/reliability.py

      - name: Validate documentation
        if: matrix.python-version == '3.12'
        run: uv run --no-sync mkdocs build --strict

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.python-version }}
          path: |
            evaluation/reports/pytest-ci.xml
            evaluation/reports/v0_3_rag.json

  model-evaluation:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/huggingface
          key: model-${{ runner.os }}-${{ hashFiles('uv.lock', 'evaluation/configs/v0_3_safety.json') }}
      - run: pip install uv
      - run: uv sync --locked --extra all --extra dev
      - name: Validate real-model embeddings
        run: LONGCACHE_TEST_MODEL=1 uv run --no-sync pytest tests/test_embedder.py -q
      - name: Prepare committed v0.1.1 comparison
        run: |
          mkdir -p /tmp/longcache-v011
          git archive 8a47ebd | tar -x -C /tmp/longcache-v011
      - name: Evaluate frozen synthetic correctness gates
        run: uv run --no-sync python -m evaluation.run --config evaluation/configs/v0_3_safety.json --baseline-root /tmp/longcache-v011
      - name: Evaluate warm-hit latency budget
        run: uv run --no-sync python -m evaluation.performance --baseline-root /tmp/longcache-v011
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v03-evaluation
          path: evaluation/reports/

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, model-evaluation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine "readme-renderer[md]"
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Check package metadata
        run: python scripts/check_package_metadata.py

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
      - run: pip install uv
      - name: Verify clean wheel on supported Python versions
        run: |
          for python_version in 3.11 3.12; do
            uv python install "$python_version"
            uv venv "/tmp/wheel-check-$python_version" --python "$python_version"
            wheel_python="/tmp/wheel-check-$python_version/bin/python"
            uv pip install --python "$wheel_python" "torch==2.14.0+cpu" --index-url https://download.pytorch.org/whl/cpu
            uv pip install --python "$wheel_python" dist/*.whl
            PYTHONPATH= "$wheel_python" scripts/wheel_smoke_v3.py
            "/tmp/wheel-check-$python_version/bin/longcache" --version
          done
      - name: Verify Python 3.10 rejection
        run: |
          uv python install 3.10
          uv venv /tmp/python310 --python 3.10
          python scripts/check_python_requirement.py --python /tmp/python310/bin/python --wheel dist/longcache-0.3.0-py3-none-any.whl
