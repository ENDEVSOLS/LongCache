[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longcache"
version = "0.3.0"
description = "Semantic similarity cache for LLM/RAG pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["llm", "cache", "rag", "langchain", "openai", "cost-reduction", "semantic-cache", "faiss", "embedding"]
authors = [
    { name = "ENDEVSOLS", email = "technology@endevsols.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # NumPy: <2.0.0 required — v2.0 breaks faiss-cpu and torch ABI compatibility
    "numpy>=1.24.0,<2.0.0",
    # FAISS: 1.7.4+ fixes segfaults on modern Linux/ARM64
    "faiss-cpu>=1.7.4",
    # sentence-transformers: 2.3.0+ required for BGE/modern HuggingFace model support
    "sentence-transformers>=2.3.0",
    # torch: routed to CPU index via tool.uv.sources (avoids 3GB+ nvidia CUDA packages)
    "torch",
    "click>=8.1.0",
]

[project.optional-dependencies]
redis = [
    # redis-py 5.x: built-in asyncio support and modern connection pooling
    "redis>=5.0.0,<6.0.0",
]
langchain = [
    # LangChain 1.0 released Oct 2025 — stable semver, no breaking changes until v2.0
    "langchain-core>=1.0.0,<2.0.0",
    # LangGraph 1.0 released Oct 2025 — core StateGraph/nodes/edges API unchanged
    "langgraph>=1.0.0,<2.0.0",
]
llamaindex = [
    # llama-index-core: cap at <1.0.0 until stable 1.0 confirmed
    "llama-index-core>=0.10.0,<1.0.0",
]
openai = [
    # openai v1.x: stable async client; cap at <2.0.0 for safety
    "openai>=1.0.0,<2.0.0",
]
server = [
    # fastapi 0.109+: fixes SSE/streaming disconnect memory leaks
    "fastapi>=0.109.0,<1.0.0",
    # starlette 0.36+ required companion for fastapi 0.109+
    "starlette>=0.36.0,<1.0.0",
    # uvicorn 0.27+: modern HTTP/1.1 keep-alive stability
    "uvicorn>=0.27.0,<1.0.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]
all = ["longcache[redis,langchain,llamaindex,openai,server]"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff==0.17.3",
    "mypy>=1.9.0",
    "build>=1.1.0",
    "twine>=5.0.0",
    "readme-renderer[md]>=43.0",
]

[project.scripts]
longcache = "longcache.cli:main"

[project.urls]
Repository = "https://github.com/ENDEVSOLS/LongCache"
Documentation = "https://endevsols.github.io/LongCache"
Changelog = "https://github.com/ENDEVSOLS/LongCache/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/ENDEVSOLS/LongCache/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/longcache"]

[tool.hatch.build.targets.sdist]
include = [
    "src/longcache/**",
    "tests/**",
    "evaluation/**",
    "examples/**",
    "docs/**",
    "scripts/**",
    "mkdocs.yml",
    "Makefile",
    "uv.lock",
    ".python-version",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
